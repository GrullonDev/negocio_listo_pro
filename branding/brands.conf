# Identidad nativa por marca (white-label). Una línea por marca:
#   clave|nombre de la app|sufijo del ID|color de fondo del ícono
#
# - La clave es la misma de --dart-define=BRAND=<clave> y de
#   BrandConfig.presets (lib/core/branding/brand_config.dart).
# - El sufijo se agrega al applicationId (Android) y al bundle ID (iOS):
#   cada marca se instala como una app separada, con sus propios datos.
# - Lo leen android/app/build.gradle.kts y branding/ios_brand.sh.
