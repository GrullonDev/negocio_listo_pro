services:
  postgres:
    image: postgres:16-alpine
    container_name: negociolisto-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: negociolisto
      POSTGRES_PASSWORD: change_me_in_dev
      POSTGRES_DB: negociolisto_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U negociolisto -d negociolisto_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
