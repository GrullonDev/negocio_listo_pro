name: negocio_listo_pro
description: "Plataforma multi-inquilino offline-first para digitalización de negocios."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  
  # Gestión de Estado & Inyección
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  dartz: ^0.10.1 # Para Programación Funcional (Either para manejo de errores)

  # Almacenamiento Local Offline-First
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.8

flutter:

  uses-material-design: true
